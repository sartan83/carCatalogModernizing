services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: modern/src/CarCatalog.Web/Dockerfile
    environment:
      ConnectionStrings__Catalog: "Server=sql;Database=CarCatalog;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      sql:
        condition: service_healthy

  razorpages:
    build:
      context: .
      dockerfile: modern/src/CarCatalog.RazorPages/Dockerfile
    environment:
      ConnectionStrings__Catalog: "Server=sql;Database=CarCatalog;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      # The apps share one database, so a single owner migrates and seeds it.
      Catalog__MigrateDatabaseOnStartup: "false"
    ports:
      - "8081:8080"
    depends_on:
      sql:
        condition: service_healthy
      web:
        condition: service_healthy

  wcf:
    build:
      context: .
      dockerfile: modern/src/CarCatalog.WcfService/Dockerfile
    environment:
      ConnectionStrings__Catalog: "Server=sql;Database=CarCatalog;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Catalog__MigrateDatabaseOnStartup: "false"
    ports:
      - "8082:8080"
    depends_on:
      sql:
        condition: service_healthy
      web:
        condition: service_healthy
