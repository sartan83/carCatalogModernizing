apiVersion: v1
kind: Service
metadata:
  name: razorpages
  namespace: car-catalog
spec:
  selector:
    app: razorpages
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: razorpages
  namespace: car-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: razorpages
  template:
    metadata:
      labels:
        app: razorpages
    spec:
      initContainers:
        - name: wait-for-sql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z sql 1433; do echo waiting for sql; sleep 3; done
      containers:
        - name: razorpages
          image: carcatalog/razorpages:dev
          ports:
            - name: http
              containerPort: 8080
          env:
            # The MVC app owns the shared database, so this app only reads the migrated schema.
            - name: Catalog__MigrateDatabaseOnStartup
              value: "false"
            - name: ConnectionStrings__Catalog
              valueFrom:
                secretKeyRef:
                  name: catalog-sql
                  key: connection-string
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
