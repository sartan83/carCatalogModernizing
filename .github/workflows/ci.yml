name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Build and test (.NET Framework)
    runs-on: windows-latest

    env:
      Configuration: Release

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          msbuild CarCatalogLegacyMVCSolution/CarCatalogLegacyMVC.sln -t:Restore -verbosity:minimal
          msbuild CarCatalogLegacyWebFormsSolution/CarCatalogLegacyWebForms.sln -t:Restore -verbosity:minimal
          msbuild CarCatalogLegacyNTier/CarCatalogLegacyNTier.sln -t:Restore -verbosity:minimal
          msbuild tests/CarCatalog.CharacterizationTests/CarCatalog.CharacterizationTests.csproj -t:Restore -verbosity:minimal

      - name: Build MVC solution
        run: msbuild CarCatalogLegacyMVCSolution/CarCatalogLegacyMVC.sln -p:Configuration=Release -verbosity:minimal

      - name: Build Web Forms solution
        run: msbuild CarCatalogLegacyWebFormsSolution/CarCatalogLegacyWebForms.sln -p:Configuration=Release -verbosity:minimal

      - name: Build N-Tier solution
        run: msbuild CarCatalogLegacyNTier/CarCatalogLegacyNTier.sln -p:Configuration=Release -verbosity:minimal

      - name: Build characterization tests
        run: msbuild tests/CarCatalog.CharacterizationTests/CarCatalog.CharacterizationTests.csproj -p:Configuration=Release -verbosity:minimal

      - name: Run characterization tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -requires Microsoft.VisualStudio.Workload.ManagedDesktop Microsoft.VisualStudio.Workload.Web -find "Common7\IDE\Extensions\TestPlatform\vstest.console.exe" | Select-Object -First 1
          if (-not $vstest) {
            $vstest = & $vswhere -latest -find "Common7\IDE\Extensions\TestPlatform\vstest.console.exe" | Select-Object -First 1
          }
          if (-not $vstest) { throw "vstest.console.exe not found" }
          & $vstest "tests\CarCatalog.CharacterizationTests\bin\Release\net472\CarCatalog.CharacterizationTests.dll" /Logger:trx /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { throw "Characterization tests failed" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  modern:
    name: Build and test (.NET 8, Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore modern/CarCatalog.Modern.sln

      - name: Build
        run: dotnet build modern/CarCatalog.Modern.sln -c Release --no-restore

      - name: Test
        run: dotnet test modern/CarCatalog.Modern.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-test-results
          path: TestResults
          if-no-files-found: ignore

  containers:
    name: Container images and compose smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t carcatalog/web:ci -f modern/src/CarCatalog.Web/Dockerfile .
          docker build -t carcatalog/razorpages:ci -f modern/src/CarCatalog.RazorPages/Dockerfile .
          docker build -t carcatalog/wcf:ci -f modern/src/CarCatalog.WcfService/Dockerfile .

      - name: Start the stack
        env:
          MSSQL_SA_PASSWORD: ${{ format('Ci-{0}-Aa1!', github.run_id) }}
        run: docker compose up -d --wait --wait-timeout 600

      - name: Smoke test the apps
        run: |
          set -euo pipefail
          for url in http://localhost:8080/ http://localhost:8080/Catalog/Details/1 \
                     http://localhost:8081/ http://localhost:8081/Catalog/Details/1 \
                     'http://localhost:8082/CatalogService.svc?wsdl'; do
            code=$(curl -sS --retry 10 --retry-all-errors --retry-delay 5 -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $code"
            [ "$code" = 200 ]
          done

      - name: Dump container logs
        if: failure()
        env:
          MSSQL_SA_PASSWORD: ${{ format('Ci-{0}-Aa1!', github.run_id) }}
        run: docker compose logs

      - name: Stop the stack
        if: always()
        env:
          MSSQL_SA_PASSWORD: ${{ format('Ci-{0}-Aa1!', github.run_id) }}
        run: docker compose down -v

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Validate
        run: kubectl kustomize k8s | kubeconform -strict -summary -kubernetes-version 1.30.0 -
